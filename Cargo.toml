[package]
name = "selectables"
authors = [
    "Srikanth Anantharam <sria91@gmail.com>",
    "GitHub Copilot <copilot@github.com>",
    "Anthropic Claude <claude@anthropic.com>",
]
version = "0.2.0"
edition = "2024"
description = "Lock-free channels with a unified select! macro for recv and send arms"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sria91/selectables"
documentation = "https://docs.rs/selectables"
keywords = ["channels", "select", "concurrency", "lock-free", "broadcast"]
categories = ["algorithms", "concurrency", "data-structures"]

[dependencies]
arc-swap = "1"
crossbeam-queue = "0.3"
log = { version = "0.4", optional = true }

[dev-dependencies]
minimal_logger = "0.2"

[features]
debug-logs = ["log"]
default = []
